name: PashuSetu 3 — Compose APK and device QA
on:
  push:
    branches: [compose-v3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pashusetu-compose-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Compose and Android tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk PashuSetu-3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PashuSetu-3.0-APK
          path: PashuSetu-3.0.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Compose-test-APK
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
  device-qa:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PashuSetu-3.0-APK
      - uses: actions/download-artifact@v4
        with:
          name: Compose-test-APK
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install PashuSetu-3.0.apk && adb install app-debug-androidTest.apk
            adb shell am instrument -w -r -e class in.pashusetu.app.ComposeFlowTest in.pashusetu.app.test/androidx.test.runner.AndroidJUnitRunner | tee compose-results.txt
            mkdir -p screenshots
            for s in 01-home-empty 02-registration 03-passport 04-growth 05-reports; do adb exec-out run-as in.pashusetu.app cat files/$s.png > screenshots/$s.png || true; done
            adb logcat -d -t 2500 > logcat.txt
            grep -q "OK (2 tests)" compose-results.txt
            for s in screenshots/*.png; do test -s "$s" || exit 1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Compose-device-QA
          path: |
            compose-results.txt
            logcat.txt
            screenshots/
          if-no-files-found: warn
