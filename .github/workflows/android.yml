name: Build and test Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build native Android app and instrumentation APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk PashuSetu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PashuSetu-APK
          path: PashuSetu.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Android-test-APK
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
  native-smoke:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PashuSetu-APK
      - uses: actions/download-artifact@v4
        with:
          name: Android-test-APK
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native screens on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install PashuSetu.apk && adb install app-debug-androidTest.apk
            adb shell am instrument -w in.pashusetu.app.test/in.pashusetu.app.SmokeInstrumentation | tee smoke-result.txt
            mkdir -p screenshots
            for s in dashboard-empty passport growth dashboard reports; do adb exec-out run-as in.pashusetu.app cat files/qa-$s.png > screenshots/$s.png || true; done
            grep -q NATIVE_SMOKE_PASS smoke-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-screen-QA
          path: |
            smoke-result.txt
            screenshots/
          if-no-files-found: warn
