name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check JavaScript syntax
        run: |
          python3 -c "from pathlib import Path; Path('/tmp/pashu.js').write_text(Path('index.html').read_text().split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/pashu.js
      - name: Assemble signed debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk PashuSetu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PashuSetu-APK
          path: PashuSetu.apk
          if-no-files-found: error
