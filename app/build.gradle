plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'in.pashusetu.app'
    compileSdk 35
    defaultConfig {
        applicationId 'in.pashusetu.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
        testInstrumentationRunner 'in.pashusetu.app.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
