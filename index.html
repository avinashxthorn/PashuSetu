-columns:repeat(4,minmax(0,1fr));gap:10px}.quick{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:white;color:var(--ink);border:1px solid var(--line);border-radius:17px;padding:14px 12px;text-align:left;font-size:12px;box-shadow:0 3px 10px #173b2809}.quick span{display:grid;place-items:center;width:39px;height:39px;background:#e6f2e9;color:#17674e;border-radius:12px}.quick:nth-child(2) span{background:#fbece7;color:#ad563e}.quick:nth-child(3) span{background:#e8effb;color:#4166a3}.quick:nth-child(4) span{background:#fff2d9;color:#926325}.ui-icon{width:23px;height:23px;display:inline-block;vertical-align:middle}.animal{color:var(--ink);box-shadow:0 3px 10px #173b2809;border-radius:17px}nav{gap:3px;box-shadow:0 -4px 15px #173b2810}nav button{font-size:11px;font-weight:650;min-height:58px}nav button span{display:grid;place-items:center;height:27px;margin:0 auto 3px}nav button.active{background:transparent;color:var(--green)}nav button.active span{width:49px;background:#e1f0e5;border-radius:14px}button{transition:transform .12s,background .15s}button:active{transform:scale(.98)}button:disabled{opacity:.6;cursor:wait;transform:none}.empty{font-size:14px;line-height:1.5;border-radius:18px}.pill{font-weight:650}.detail b{font-size:14px}dialog{padding:0;border-radius:24px;width:min(680px,96vw);max-height:92dvh}.dialog-top{position:sticky;top:0;z-index:2;background:white;padding:18px 20px;border-bottom:1px solid var(--line)}.dialog-intro{padding:3px 20px 0}dialog form{padding:0 20px}dialog .actions{position:sticky;bottom:0;z-index:2;margin:18px -20px 0;padding:14px 20px;background:white;border-top:1px solid var(--line)}dialog .actions .primary{flex:1}dialog .formgrid{padding-top:12px;gap:16px}input,select,textarea{border-radius:13px;background:#fafcfb;border-color:#d9e3dc;font-size:16px}label{font-size:13px;gap:7px}.formsection{grid-column:1/-1;border-top:1px solid var(--line);padding-top:13px;font-weight:800;font-size:11px;letter-spacing:1.2px;c </style></head><body><header><div><strong>🌿 PashuSetu</strong><small>पशुसेतु · Your livestock companion</small></div><button id="language" type="button">हिन्दी</button></header><main id="main" aria-busy="true"><div class="skeleton sk-hero"></div><div class="grid stats"><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div></div><div class="load-status" role="status"><span class="spinner"></span>Opening your animal register…</div><div class="skeleton sk-wide"></div></main><nav id="nav" aria-label="Main navigation"></nav><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s), E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}, uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const key='pashusetu-v1';let state={animals:[],records:[],hi:false};let storageOK=true;
let db=null,booting=true,saving=false;
function validState(x){return x&&Array.isArray(x.animals)&&Array.isArray(x.records)}
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('PashuSetu',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('register'))req.result.createObjectStore('register')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('Database is busy'))})}
function readDB(){return new Promise((resolve,reject)=>{let req=db.transaction('register','readonly').objectStore('register').get('state');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function writeDB(next){return new Promise((resolve,reject)=>{let tx=db.transaction('register','readwrite');tx.oncomplete=()=>resolve();tx.onabort=()=>reject(tx.error||Error('Save aborted'));tx.onerror=()=>reject(tx.error);tx.objectStore('register').put(next,'state')})}
async function boot(){booting=true;try{db=await openDB();let found=await readDB();if(found===undefined){let raw=localStorage.getItem(key),old=raw?JSON.parse(raw):state;if(!validState(old))throw Error('Invalid saved register');await writeDB(old);state=old}else if(validState(found))state=found;else throw Error('Invalid database');storageOK=true;booting=false;$('#main').setAttribute('aria-busy','false');render()}catch(e){storageOK=false;booting=true;$('#main').setAttribute('aria-busy','false');$('#main').innerHTML='<div class="card"><h1>Could not open your register</h1><p>Your existing records have not been changed. Check device storage and retry.</p><button class="primary" id="retry">Try again</button></div>';$('#retry').onclick=()=>{if(db)db.close();db=null;$('#main').setAttribute('aria-busy','true');$('#main').innerHTML='<div class="load-status"><span class="spinner"></span>Opening register…</div>';boot()}}}
let page='home',selected=null,filter='',query='',toastTimer;
const T=(en,hi)=>state.hi?hi:en, species=['Cow','Buffalo','Goat','Sheep','Rabbit','Poultry','Dog','Other'], icons=['🐄','🐃','🐐','🐑','🐇','🐔','🐕','🐾'], hindi=['गाय','भैंस','बकरी','भेड़','खरगोश','मुर्गी','कुत्ता','अन्य'], sp=s=>T(s,hindi[species.indexOf(s)]||s), ico=s=>icons[species.indexOf(s)]||'🐾', status=s=>T(s,({Healthy:'स्वस्थ',Sick:'बीमार',Recovering:'ठीक हो रहा',Unknown:'अज्ञात'})[s]||s), types={health:['Health visit','स्वास्थ्य जांच','🩺'],vaccine:['Vaccination','टीकाकरण','💉'],breeding:['Breeding','प्रजनन','🐣'],production:['Milk / growth','दूध / वृद्धि','🥛'],feed:['Feed','चारा','🌾'],finance:['Income / expense','आय / खर्च','₹']}, money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function notify(s){let x=$('#toast');x.textContent=s;x.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.hidden=true,3500)}
async function commit(next){if(saving||booting)return false;saving=true;let submit=$('#entry button[type=submit]'),form=$('#entry'),message=$('#form-error');if(submit){submit.disabled=true;submit.innerHTML='<span class="spinner"></span>'+T('Saving…','सहेज रहे हैं…')}if(form)form.setAttribute('aria-busy','true');document.querySelectorAll('nav button,#language').forEach(b=>b.disabled=true);try{await writeDB(next);state=next;storageOK=true;return true}catch(e){let msg=T('Could not save. Check storage and retry.','सहेज नहीं सके। स्टोरेज जांचें।');if(message)message.textContent=msg;else notify(msg);return false}finally{saving=false;if(submit){submit.disabled=false;submit.textContent=T('Save record','सहेजें')}if(form)form.setAttribute('aria-busy','false');document.querySelectorAll('nav button,#language').forEach(b=>b.disabled=false)}}
function go(p,id=null){if(booting||saving)return;page=p;selected=id;query='';filter='';render();window.scrollTo(0,0)}
const glyphs={home:'<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/>',animals:'<path d="M6 10 3 6l5 1 2 2h4l2-2 5-1-3 4v5a6 6 0 0 1-12 0z"/><path d="M9 13h.01M15 13h.01M9 17q3-2 6 0"/>',records:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 9h6M9 13h6M9 17h4"/>',reports:'<path d="M4 3v17h17M8 16v-4M13 16V8M18 16V5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3 3 2 2-1 4 3 3 3-1 2 3 3-1 1-3 4-1 1-3-2-2 1-4-3-3-3 1-2-2z"/>',health:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',vaccine:'<path d="m14 3 7 7M17 6l-9 9-4-4 9-9M6 13l-3 6 6-3m-7 6 3-3"/>',production:'<path d="M12 3c-3 5-7 9-7 13a7 7 0 0 0 14 0c0-4-4-8-7-13z"/>',finance:'<path d="M6 5h12M6 9h12M6 5q10 0 8 8H6l10 7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-11 4h4"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',plus:'<path d="M12 5v14M5 12h14"/>'};function icon(k){return '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(glyphs[k]||glyphs.records)+'</svg>'}
function quick(k,en,hi){return '<button class="quick" data-action="record:'+k+'"><span>'+icon(k)+'</span>'+T(en,hi)+'</button>'}
function sectionHead(en,hi,action,aEn,aHi){return '<div class="section-head"><h2>'+T(en,hi)+'</h2>'+(action?btn(T(aEn,aHi)+' ›',action):'')+'</div>'}
function btn(txt,action,cls=''){return '<button type="button" class="'+cls+'" data-action="'+E(action)+'">'+txt+'</button>'}
function stat(emoji,n,l){return '<div class="card stat"><span class="ico">'+emoji+'</span><b>'+E(n)+'</b><small>'+l+'</small></div>'}
function empty(s){return '<div class="empty">'+s+'</div>'}
function title(en,hi,sub){return '<h1>'+T(en,hi)+'</h1><p>'+sub+'</p>'}
function animalRow(a){return '<button class="animal" data-action="profile:'+E(a.id)+'"><span class="avatar">'+ico(a.species)+'</span><span class="desc"><strong>'+E(a.name)+'</strong><br><span class="muted">'+E(sp(a.species))+' · '+E(a.tag||a.breed||T('No tag','टैग नहीं'))+'</span></span><span class="pill '+(a.status==='Sick'?'warn':a.status==='Healthy'?'':'neutral')+'">'+E(status(a.status))+'</span><span>›</span></button>'}
function reminders(){let latest=new Map();for(let r of state.records.filter(r=>r.type==='vaccine'||r.type==='health').sort((a,b)=>a.date.localeCompare(b.date))){let k=r.animal+'|'+r.type+'|'+(r.type==='vaccine'?String(r.title).toLowerCase().trim():'follow');latest.set(k,r)}return [...latest.values()].filter(r=>r.due&&state.animals.some(a=>a.id===r.animal)).sort((a,b)=>a.due.localeCompare(b.due))}
function donut(items){let total=items.reduce((s,i)=>s+i[1],0),p=0,colors=['#34795a','#d7a84e','#d77d54','#6f91a7','#9b85ba','#8aab72','#a5b5ad','#c8d4cb'];let stops=items.map((i,k)=>{let start=p;p+=total?i[1]/total*100:0;return colors[k%colors.length]+' '+start+'% '+p+'%'});return '<div class="chart"><div class="donut" style="background:'+(total?'conic-gradient('+stops.join(',')+')':'#e9eee9')+'"><div><b>'+total+'</b><small>'+T('Total','कुल')+'</small></div></div><div class="legend">'+items.filter(i=>i[1]>0).map(i=>'<div><span class="dot" style="background:'+colors[items.indexOf(i)%colors.length]+'"></span>'+E(i[0])+'<strong style="margin-left:auto">'+i[1]+'</strong></div>').join('')+(!total?'<span>'+T('No records yet','अभी डेटा नहीं')+'</span>':'')+'</div></div>'}
function bars(items){let max=Math.max(1,...items.map(i=>i[1]));return items.map(i=>'<div class="barrow"><span>'+E(i[0])+'</span><div class="track"><div class="fill" style="width:'+Math.max(0,i[1]/max*100)+'%"></div></div><b>'+E(i[1].toLocaleString('en-IN',{maximumFractionDigits:1}))+'</b></div>').join('')}

function render(){document.documentElement.lang=state.hi?'hi':'en';$('#language').textContent=T('हिन्दी','English');$('#nav').innerHTML=[['home','⌂','Home','होम'],['animals','🐾','Animals','पशु'],['records','▤','Records','रिकॉर्ड'],['reports','▥','Reports','रिपोर्ट'],['settings','⚙','Settings','सेटिंग']].map(([p,i,en,hi])=>'<button data-action="go:'+p+'" class="'+((page===p||p==='animals'&&page==='profile')?'active':'')+'"><span>'+icon(p)+'</span>'+T(en,hi)+'</button>').join('');let content=page==='home'?home():page==='animals'?animalList():page==='profile'?profile():page==='reports'?title('Farm reports','फार्म रिपोर्ट',T('Charts update from your saved records.','चार्ट आपके रिकॉर्ड से बनते हैं।'))+'<div class="section">'+reportCards()+'</div>':page==='records'?title('All records','सभी रिकॉर्ड',T('Health, vaccines, breeding, feed and more.','स्वास्थ्य, टीके, प्रजनन और चारा।'))+'<div class="grid section">'+Object.entries(types).map(([k,v])=>btn(v[2]+' '+T(v[0],v[1]),'record:'+k)).join('')+'</div><div class="card section">'+(state.records.length?state.records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(recordRow).join(''):empty(T('No records yet.','अभी कोई रिकॉर्ड नहीं।')))+'</div>':settings();$('#main').classList.remove('page-content');void $('#main').offsetWidth;$('#main').classList.add('page-content');$('#main').innerHTML=(!storageOK?'<p class="alert">'+T('Browser storage could not be read.','ब्राउज़र डेटा पढ़ा नहीं जा सका।')+'</p>':'')+content;if(page==='animals'){results();$('#search').oninput=e=>{query=e.target.value;results()};$('#filter').onchange=e=>{filter=e.target.value;results()}}}
function download(name,data,mime){if(window.PashuAndroid){window.PashuAndroid.save(name,data,mime);return;}let url=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function demo(){if(state.animals.length){notify(T('Sample data is only available for an empty register.','नमूने केवल खाली रजिस्टर में जोड़ सकते हैं।'));return}let a=[{id:uid(),name:'Gauri',species:'Cow',breed:'Gir',tag:'DEMO-01',sex:'Female',status:'Healthy',weight:'350',owner:'Demo farmer',village:'Sample village'},{id:uid(),name:'Kali',species:'Buffalo',breed:'Murrah',tag:'DEMO-02',sex:'Female',status:'Healthy',weight:'480'},{id:uid(),name:'Chutki',species:'Goat',breed:'Sirohi',tag:'DEMO-03',sex:'Female',status:'Recovering',weight:'28'}];let r=[{id:uid(),animal:a[0].id,type:'production',date:day(),milk:'8',notes:'Fictional sample'},{id:uid(),animal:a[0].id,type:'vaccine',date:day(),title:'Example recorded dose',notes:'Demo only, not a schedule'},{id:uid(),animal:a[2].id,type:'health',date:day(),title:'Example checkup',notes:'Demo only'}];if(await commit({...state,animals:a,records:r})){go('home');notify(T('Sample data added','नमूना डेटा जोड़ा गया'))}}
document.addEventListener('click',async e=>{if(booting||saving)return;let b=e.target.closest('[data-action]');if(!b)return;let [act,id]=b.dataset.action.split(':');switch(act){case'go':go(id);break;case'profile':go('profile',id);break;case'add':formOpen('animal');break;case'edit':formOpen('animal',id);break;case'record':formOpen(id);break;case'editRecord':{let r=state.records.find(x=>x.id===id);if(r)formOpen(r.type,id);break}case'close':$('#modal').close();break;case'delete':if(confirm(T('Delete this animal and all its records?','इस पशु और सभी रिकॉर्ड को हटाएं?'))&&await commit({...state,animals:state.animals.filter(a=>a.id!==id),records:state.records.filter(r=>r.animal!==id)}))go('animals');break;case'deleteRecord':if(confirm(T('Delete this record?','रिकॉर्ड हटाएं?'))&&await commit({...state,records:state.records.filter(r=>r.id!==id)}))render();break;case'export':download('pashusetu-'+day()+'.json',JSON.stringify(state,null,2),'application/json');break;case'csv':{let cols=animalFields.map(f=>f[0]),esc=x=>'"'+String(x??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';download('animals.csv','\uFEFF'+[cols.join(','),...state.animals.map(a=>cols.map(k=>esc(a[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8');break}case'demo':demo();break}});
$('#language').onclick=async()=>{if(booting||saving)return;if(await commit({...state,hi:!state.hi}))render()};boot();
</script></body></html>
