<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#164e3c"><title>PashuSetu • पशुसेतु</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f5f7f3;color:#21352d}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;min-height:44px;padding:12px 17px;border-radius:12px;font-weight:650;background:#e8efe9;color:#164e3c}button.primary{background:#176344;color:white}button.danger{color:#a13232;background:#fbeaea}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d7a43b;outline-offset:2px}header{background:#133f31;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:23px}header small{display:block;color:#b9d4c3}header button{background:#2d5b4a;color:white}main{max-width:1120px;margin:auto;padding:24px 20px 110px}h1{font-size:clamp(25px,4vw,36px);margin:0 0 6px;letter-spacing:-.9px}h2{font-size:19px;margin:0 0 14px}h3{margin:0 0 6px;font-size:17px}p{line-height:1.5;margin:8px 0;color:#64736b}.hero{background:#e1eee3;border:1px solid #cce0cd;padding:24px;border-radius:22px;display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#397454;text-transform:uppercase;margin-bottom:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:white;border:1px solid #e1e7df;border-radius:18px;padding:18px;min-width:0}.stat b{display:block;font-size:32px;letter-spacing:-1px;margin:6px 0}.stat small{color:#65766b}.stat .ico{font-size:22px}.section{margin-top:22px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:grid;gap:10px}.animal{display:flex;align-items:center;gap:13px;text-align:left;width:100%;background:white;border:1px solid #e5eae3;padding:15px}.avatar{width:50px;height:50px;border-radius:15px;background:#edf3e8;display:grid;place-items:center;font-size:27px;flex-shrink:0}.animal .desc{flex:1;min-width:0;overflow-wrap:anywhere}.muted{color:#67766c;font-size:13px}.pill{display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;background:#e6f2e8;color:#22653e}.pill.warn{background:#fce8d9;color:#974913}.pill.neutral{background:#e9edf6;color:#445c86}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:6px;background:#fff;border-top:1px solid #dce4da;padding:8px 8px max(8px,env(safe-area-inset-bottom))}nav button{flex:1;max-width:180px;background:transparent;padding:7px 0;font-size:12px;color:#65766b}nav button span{display:block;font-size:22px;margin-bottom:3px}nav button.active{background:#e0eee4;color:#164e3c}.donut{height:146px;width:146px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.donut>div{background:#fff;width:94px;height:94px;border-radius:50%;display:grid;place-content:center;text-align:center}.donut b{font-size:25px}.legend{display:grid;gap:9px;flex:1;font-size:13px}.legend div{display:flex;gap:7px;align-items:center}.dot{height:10px;width:10px;border-radius:4px;display:inline-block;flex-shrink:0}.barrow{display:grid;grid-template-columns:minmax(75px,1fr) 2fr 42px;gap:8px;align-items:center;font-size:13px;margin:12px 0}.track{background:#edf1ed;border-radius:7px;height:12px;overflow:hidden}.fill{height:100%;border-radius:7px;background:#438565}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:grid;gap:5px;font-weight:600;font-size:14px}input,select,textarea{width:100%;padding:12px;border:1px solid #cfdacf;border-radius:10px;background:#fff;color:#21352d;min-height:45px}textarea{resize:vertical;min-height:80px}.wide{grid-column:1/-1}dialog{border:0;border-radius:20px;padding:22px;width:min(680px,94vw);max-height:90dvh;overflow:auto;color:inherit;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#122b22a8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.empty{padding:24px;text-align:center;color:#67766c;background:#fff;border:1px dashed #cfdacf;border-radius:16px}.alert{padding:12px;border-radius:12px;background:#fff2dc;color:#79521a;border:1px solid #f2dfb9}.record{border-top:1px solid #e6ebe5;padding:12px 0;overflow-wrap:anywhere}.record p{white-space:pre-wrap}.detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detail div{overflow-wrap:anywhere}.detail b{display:block}.chart{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.linechart{width:100%;height:auto;overflow:visible}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#143f31;color:white;padding:13px 20px;border-radius:12px;z-index:20;max-width:90vw;box-shadow:0 5px 20px #0002}.toast[hidden]{display:none}.search{display:flex;gap:10px;margin:15px 0}.search input{flex:2}.search select{flex:1}.fine{font-size:12px;color:#6b786e}hr{border:0;border-top:1px solid #e5eae3;margin:18px 0}@media(max-width:600px){main{padding:18px 14px 100px}.hero{padding:18px;align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid:not(.stats){grid-template-columns:1fr}.card{padding:15px}.formgrid{grid-template-columns:1fr}header{padding:14px}.search{flex-wrap:wrap}.search input,.search select{flex-basis:100%}.stat b{font-size:28px}}
</style></head><body><header><div><strong>🌿 PashuSetu</strong><small>पशुसेतु · Your livestock companion</small></div><button id="language" type="button">हिन्दी</button></header><main id="main"></main><nav id="nav" aria-label="Main navigation"></nav><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s), E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}, uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const key='pashusetu-v1';let state={animals:[],records:[],hi:false};let storageOK=true;
try{let raw=localStorage.getItem(key);if(raw){let x=JSON.parse(raw);if(Array.isArray(x.animals)&&Array.isArray(x.records))state=x;else storageOK=false}}catch(e){storageOK=false}
let page='home',selected=null,filter='',query='',toastTimer;
const T=(en,hi)=>state.hi?hi:en, species=['Cow','Buffalo','Goat','Sheep','Rabbit','Poultry','Dog','Other'], icons=['🐄','🐃','🐐','🐑','🐇','🐔','🐕','🐾'], hindi=['गाय','भैंस','बकरी','भेड़','खरगोश','मुर्गी','कुत्ता','अन्य'], sp=s=>T(s,hindi[species.indexOf(s)]||s), ico=s=>icons[species.indexOf(s)]||'🐾', status=s=>T(s,({Healthy:'स्वस्थ',Sick:'बीमार',Recovering:'ठीक हो रहा',Unknown:'अज्ञात'})[s]||s), types={health:['Health visit','स्वास्थ्य जांच','🩺'],vaccine:['Vaccination','टीकाकरण','💉'],breeding:['Breeding','प्रजनन','🐣'],production:['Milk / growth','दूध / वृद्धि','🥛'],feed:['Feed','चारा','🌾'],finance:['Income / expense','आय / खर्च','₹']}, money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function notify(s){let x=$('#toast');x.textContent=s;x.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.hidden=true,3500)}
function commit(next){try{localStorage.setItem(key,JSON.stringify(next));state=next;storageOK=true;return true}catch(e){notify(T('Could not save. Storage may be full. Export your existing data.','सहेज नहीं सके। पुराना डेटा निर्यात करें।'));return false}}
function go(p,id=null){page=p;selected=id;query='';filter='';render();window.scrollTo(0,0)}
function btn(txt,action,cls=''){return '<button type="button" class="'+cls+'" data-action="'+E(action)+'">'+txt+'</button>'}
function stat(emoji,n,l){return '<div class="card stat"><span class="ico">'+emoji+'</span><b>'+E(n)+'</b><small>'+l+'</small></div>'}
function empty(s){return '<div class="empty">'+s+'</div>'}
function title(en,hi,sub){return '<h1>'+T(en,hi)+'</h1><p>'+sub+'</p>'}
function animalRow(a){return '<button class="animal" data-action="profile:'+E(a.id)+'"><span class="avatar">'+ico(a.species)+'</span><span class="desc"><strong>'+E(a.name)+'</strong><br><span class="muted">'+E(sp(a.species))+' · '+E(a.tag||a.breed||T('No tag','टैग नहीं'))+'</span></span><span class="pill '+(a.status==='Sick'?'warn':a.status==='Healthy'?'':'neutral')+'">'+E(status(a.status))+'</span><span>›</span></button>'}
function reminders(){let latest=new Map();for(let r of state.records.filter(r=>r.type==='vaccine'||r.type==='health').sort((a,b)=>a.date.localeCompare(b.date))){let k=r.animal+'|'+r.type+'|'+(r.type==='vaccine'?String(r.title).toLowerCase().trim():'follow');latest.set(k,r)}return [...latest.values()].filter(r=>r.due&&state.animals.some(a=>a.id===r.animal)).sort((a,b)=>a.due.localeCompare(b.due))}
function donut(items){let total=items.reduce((s,i)=>s+i[1],0),p=0,colors=['#34795a','#d7a84e','#d77d54','#6f91a7','#9b85ba','#8aab72','#a5b5ad','#c8d4cb'];let stops=items.map((i,k)=>{let start=p;p+=total?i[1]/total*100:0;return colors[k%colors.length]+' '+start+'% '+p+'%'});return '<div class="chart"><div class="donut" style="background:'+(total?'conic-gradient('+stops.join(',')+')':'#e9eee9')+'"><div><b>'+total+'</b><small>'+T('Total','कुल')+'</small></div></div><div class="legend">'+items.filter(i=>i[1]>0).map(i=>'<div><span class="dot" style="background:'+colors[items.indexOf(i)%colors.length]+'"></span>'+E(i[0])+'<strong style="margin-left:auto">'+i[1]+'</strong></div>').join('')+(!total?'<span>'+T('No records yet','अभी डेटा नहीं')+'</span>':'')+'</div></div>'}
function bars(items){let max=Math.max(1,...items.map(i=>i[1]));return items.map(i=>'<div class="barrow"><span>'+E(i[0])+'</span><div class="track"><div class="fill" style="width:'+Math.max(0,i[1]/max*100)+'%"></div></div><b>'+E(i[1].toLocaleString('en-IN',{maximumFractionDigits:1}))+'</b></div>').join('')}
function trend(records,field){let m={};for(let r of records)if(r[field]!==''&&r[field]!=null&&Number.isFinite(+r[field]))m[r.date]=(m[r.date]||0)+Number(r[field]);let pts=Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).slice(-14);if(!pts.length)return empty(T('Add production records to see trends.','ग्राफ के लिए उत्पादन रिकॉर्ड जोड़ें।'));let max=Math.max(1,...pts.map(p=>p[1])),coords=pts.map((p,i)=>[32+i*256/Math.max(1,pts.length-1),115-p[1]/max*90]);return '<svg class="linechart" viewBox="0 0 320 150" role="img" aria-label="Recorded milk trend"><path d="M32 25V115H292" stroke="#b9c9bf" fill="none"/><text x="2" y="28" font-size="10">'+E(max.toFixed(1))+'</text><text x="12" y="118" font-size="10">0</text><polyline points="'+coords.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#34795a" stroke-width="3" stroke-linejoin="round"/>'+coords.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#34795a"><title>'+E(pts[i][0]+': '+pts[i][1])+'</title></circle>').join('')+'<text x="32" y="138" font-size="10">'+E(pts[0][0].slice(5))+'</text><text x="288" y="138" text-anchor="end" font-size="10">'+E(pts.at(-1)[0].slice(5))+'</text></svg>'}
function reportCards(){let a=state.animals,r=state.records,fin=r.filter(x=>x.type==='finance'),inc=fin.filter(x=>x.direction==='Income').reduce((s,x)=>s+Number(x.amount||0),0),out=fin.filter(x=>x.direction==='Expense').reduce((s,x)=>s+Number(x.amount||0),0),vac=new Set(r.filter(x=>x.type==='vaccine').map(x=>x.animal));return '<div class="grid"><div class="card"><h2>'+T('Animals by species','पशु के प्रकार')+'</h2>'+donut(species.map(s=>[sp(s),a.filter(x=>x.species===s).length]))+'</div><div class="card"><h2>'+T('Health overview','स्वास्थ्य स्थिति')+'</h2>'+donut(['Healthy','Sick','Recovering','Unknown'].map(s=>[status(s),a.filter(x=>x.status===s).length]))+'</div><div class="card"><h2>'+T('Milk trend · litres/day','दूध का ग्राफ · लीटर/दिन')+'</h2>'+trend(r.filter(x=>x.type==='production'),'milk')+'</div><div class="card"><h2>'+T('Recorded vaccination','टीकाकरण रिकॉर्ड')+'</h2>'+donut([[T('Has a record','रिकॉर्ड है'),a.filter(x=>vac.has(x.id)).length],[T('No record','रिकॉर्ड नहीं'),a.filter(x=>!vac.has(x.id)).length]])+'<p class="fine">'+T('A recorded dose does not establish full protection.','एक टीका पूर्ण सुरक्षा का प्रमाण नहीं है।')+'</p></div><div class="card"><h2>'+T('Farm finances','आय और खर्च')+'</h2>'+bars([[T('Income','आय'),inc],[T('Expense','खर्च'),out]])+'<hr><div class="between"><span>'+T('Net balance','शुद्ध आय')+'</span><strong>'+money(inc-out)+'</strong></div></div><div class="card"><h2>'+T('Recorded health visits','दर्ज स्वास्थ्य जांच')+'</h2>'+bars(species.map(s=>[sp(s),r.filter(x=>x.type==='health'&&a.some(z=>z.id===x.animal&&z.species===s)).length]))+'</div></div>'}
function home(){let a=state.animals,rem=reminders(),due=rem.filter(r=>r.due<=day());return '<div class="hero"><div><div class="eyebrow">'+T('Your digital animal register','आपकी डिजिटल पशु डायरी')+'</div>'+title('Care for every animal.','हर पशु की देखभाल।',T('Health, records and farm progress — together.','स्वास्थ्य, रिकॉर्ड और खेती की प्रगति एक साथ।'))+'</div>'+btn(T('＋ Add animal','＋ पशु जोड़ें'),'add','primary')+'</div><div class="grid stats">'+stat('🐾',a.length,T('Total animals','कुल पशु'))+stat('♥',a.filter(x=>x.status==='Healthy').length,T('Healthy','स्वस्थ'))+stat('🩺',a.filter(x=>x.status==='Sick').length,T('Sick','बीमार'))+stat('📅',due.length,T('Due reminders','बकाया रिमाइंडर'))+'</div><section class="section"><div class="between"><h2>'+T('Quick actions','त्वरित कार्य')+'</h2></div><div class="grid">'+btn('💉 '+T('Add vaccination','टीकाकरण जोड़ें'),'record:vaccine')+btn('🩺 '+T('Health visit','स्वास्थ्य जांच'),'record:health')+btn('🥛 '+T('Milk / growth','दूध / वृद्धि'),'record:production')+btn('₹ '+T('Income / expense','आय / खर्च'),'record:finance')+'</div></section><section class="section"><div class="between"><h2>'+T('Upcoming & overdue','आगामी और बकाया')+'</h2></div>'+ (rem.length?'<div class="stack">'+rem.slice(0,5).map(r=>'<div class="card between"><div><strong>'+E(r.title)+'</strong><p>'+E(state.animals.find(a=>a.id===r.animal)?.name)+' · '+E(r.due)+'</p></div><span class="pill '+(r.due<=day()?'warn':'')+'">'+(r.due<day()?T('Overdue','बकाया'):r.due===day()?T('Today','आज'):T('Upcoming','आगामी'))+'</span></div>').join('')+'</div>':empty(T('No scheduled reminders. Add a vaccine or checkup.','कोई रिमाइंडर नहीं। टीका या जांच जोड़ें।')))+'</section><section class="section"><h2>'+T('Overview','एक नज़र में')+'</h2>'+reportCards()+'</section><section class="section"><div class="between"><h2>'+T('Your animals','आपके पशु')+'</h2>'+btn(T('View all','सभी देखें'),'go:animals')+'</div><div class="stack">'+(a.length?a.slice(-4).reverse().map(animalRow).join(''):empty(T('Register your first animal to get started.','पहला पशु जोड़ें।')))+'</div></section>'}
function animalList(){return '<div class="between"><div>'+title('My animals','मेरे पशु',T('Manage your livestock records.','अपने पशुओं के रिकॉर्ड रखें।'))+'</div>'+btn(T('＋ Add animal','＋ पशु जोड़ें'),'add','primary')+'</div><div class="search"><input id="search" aria-label="Search animals" placeholder="'+T('Search name, tag, owner, village…','नाम, टैग, मालिक, गांव खोजें…')+'" value="'+E(query)+'"><select id="filter" aria-label="Filter species"><option value="">'+T('All species','सभी पशु')+'</option>'+species.map(s=>'<option '+(filter===s?'selected':'')+' value="'+s+'">'+sp(s)+'</option>').join('')+'</select></div><div id="results" class="stack"></div>'}
function results(){let a=state.animals.filter(x=>(!filter||x.species===filter)&&[x.name,x.tag,x.owner,x.village,x.breed].some(v=>String(v||'').toLowerCase().includes(query.toLowerCase())));$('#results').innerHTML=a.length?a.map(animalRow).join(''):empty(T('No matching animals.','कोई पशु नहीं मिला।'))}
function profile(){let a=state.animals.find(x=>x.id===selected);if(!a)return empty(T('Animal not found','पशु नहीं मिला'));let r=state.records.filter(x=>x.animal===a.id).sort((x,y)=>y.date.localeCompare(x.date));return btn('‹ '+T('All animals','सभी पशु'),'go:animals')+'<div class="section card"><div class="between"><div><span class="avatar">'+ico(a.species)+'</span><h1>'+E(a.name)+'</h1><p>'+E(sp(a.species))+' · '+E(a.breed||'—')+' · '+E(status(a.status))+'</p></div>'+btn(T('Edit','बदलें'),'edit:'+E(a.id))+'</div><hr><div class="detail">'+animalFields.filter(f=>!['name','species','breed','status'].includes(f[0])).map(f=>'<div><span class="muted">'+T(f[1],f[2])+'</span><b>'+E(a[f[0]]||'—')+'</b></div>').join('')+'</div></div><section class="section"><h2>'+T('Add a record','रिकॉर्ड जोड़ें')+'</h2><div class="grid">'+Object.entries(types).map(([k,v])=>btn(v[2]+' '+T(v[0],v[1]),'record:'+k)).join('')+'</div></section><section class="section"><h2>'+T('Record history','रिकॉर्ड इतिहास')+'</h2><div class="card">'+(r.length?r.map(recordRow).join(''):empty(T('No records yet.','अभी रिकॉर्ड नहीं हैं।')))+'</div></section><div class="actions">'+btn(T('Delete animal','पशु हटाएं'),'delete:'+E(a.id),'danger')+'</div>'}
function recordRow(r){let t=types[r.type];return '<div class="record"><div class="between"><strong>'+t[2]+' '+E(r.title||T(t[0],t[1]))+'</strong><span class="muted">'+E(r.date)+'</span></div><p>'+E(state.animals.find(a=>a.id===r.animal)?.name||'')+'</p><div class="detail">'+(recordFields[r.type]||[]).filter(f=>r[f[0]]!==''&&r[f[0]]!=null&&f[0]!=='title').map(f=>'<div><span class="muted">'+T(f[1],f[2])+'</span><b>'+E(r[f[0]])+'</b></div>').join('')+'</div><div class="actions">'+btn(T('Edit','बदलें'),'editRecord:'+E(r.id))+btn(T('Delete','हटाएं'),'deleteRecord:'+E(r.id),'danger')+'</div></div>'}
const animalFields=[['name','Animal name','पशु का नाम','text',true],['species','Species','पशु का प्रकार',species,true],['breed','Breed','नस्ल'],['tag','Ear tag / ID','कान का टैग'],['sex','Sex','लिंग',['Female','Male','Unknown']],['dob','Birth date','जन्म तिथि','date'],['age','Approx. age (months)','अनुमानित उम्र (महीने)','number'],['weight','Weight (kg)','वजन (किलो)','number'],['color','Colour / markings','रंग / पहचान'],['status','Health status','स्वास्थ्य स्थिति',['Healthy','Sick','Recovering','Unknown']],['pregnancy','Pregnancy','गर्भावस्था',['Unknown','Not applicable','Not pregnant','Pregnant']],['owner','Owner name','मालिक का नाम'],['phone','Mobile number','मोबाइल नंबर','tel'],['village','Village','गांव'],['address','Address','पता'],['purchase','Purchase date','खरीद तिथि','date'],['cost','Purchase cost (₹)','खरीद खर्च (₹)','number'],['notes','Other details','अन्य जानकारी','textarea']];
const recordFields={health:[['title','Reason / diagnosis','कारण / निदान','text',true],['symptoms','Symptoms','लक्षण','textarea'],['treatment','Treatment','उपचार','textarea'],['medicine','Vet-prescribed medicine & dose','डॉक्टर की दवा और मात्रा','textarea'],['vet','Veterinarian','पशु चिकित्सक'],['temperature','Temperature (°C)','तापमान (°C)','number'],['due','Follow-up date','अगली जांच','date'],['notes','Notes','टिप्पणी','textarea']],vaccine:[['title','Vaccine name','टीके का नाम','text',true],['batch','Batch number','बैच नंबर'],['vet','Veterinarian','पशु चिकित्सक'],['due','Next due date (as advised by vet)','अगला टीका (डॉक्टर की सलाह)','date'],['notes','Notes','टिप्पणी','textarea']],breeding:[['title','Event / procedure','घटना / प्रक्रिया','text',true],['event','Event type','प्रकार',['Heat','Insemination','Pregnancy check','Birth','Other']],['due','Expected delivery / follow-up','संभावित प्रसव / अगली जांच','date'],['offspring','Offspring details','बच्चों की जानकारी'],['vet','Veterinarian','पशु चिकित्सक'],['notes','Notes','टिप्पणी','textarea']],production:[['milk','Milk (litres)','दूध (लीटर)','number'],['weight','Weight (kg)','वजन (किलो)','number'],['eggs','Eggs (count)','अंडे (संख्या)','number'],['notes','Notes','टिप्पणी','textarea']],feed:[['title','Feed type','चारे का प्रकार','text',true],['quantity','Quantity (kg)','मात्रा (किलो)','number'],['schedule','Feeding schedule','खिलाने का समय'],['cost','Feed cost (₹)','चारे का खर्च (₹)','number'],['notes','Notes','टिप्पणी','textarea']],finance:[['title','Description','विवरण','text',true],['direction','Transaction type','लेनदेन',['Income','Expense'],true],['amount','Amount (₹)','राशि (₹)','number',true],['notes','Notes','टिप्पणी','textarea']]};
function field(f,v=''){let [k,en,hi,type='text',req=false]=f;let attrs=' name="'+k+'" '+(req?'required ':'');let control=Array.isArray(type)?'<select '+attrs+'>'+type.map(o=>'<option value="'+E(o)+'" '+(o===v?'selected':'')+'>'+E(k==='species'?sp(o):k==='status'?status(o):o)+'</option>').join('')+'</select>':type==='textarea'?'<textarea '+attrs+'>'+E(v)+'</textarea>':'<input '+attrs+' type="'+type+'" value="'+E(v)+'" '+(type==='number'?'min="0" step="any" ':'')+(['dob','purchase','date'].includes(k)?'max="'+day()+'" ':'')+'>';return '<label class="'+(type==='textarea'?'wide':'')+'">'+T(en,hi)+(req?' *':'')+control+'</label>'}
function formOpen(kind,id){let isAnimal=kind==='animal',old=isAnimal?state.animals.find(x=>x.id===id):state.records.find(x=>x.id===id),type=isAnimal?null:old?.type||kind;if(!isAnimal&&!state.animals.length){notify(T('Add an animal first.','पहले पशु जोड़ें।'));formOpen('animal');return}let fields=isAnimal?animalFields:recordFields[type],a=old||{},html='<div class="between"><h2 style="margin:0">'+(isAnimal?T(old?'Edit animal':'Register animal',old?'पशु बदलें':'पशु जोड़ें'):T(types[type][0],types[type][1]))+'</h2>'+btn('✕','close')+'</div><p>'+T('Fields marked * are required.','* वाले फ़ील्ड ज़रूरी हैं।')+'</p><form id="entry"><div class="formgrid">';if(!isAnimal){html+=field(['animal','Animal','पशु',state.animals.map(x=>x.id),true],a.animal||selected||state.animals[0].id).replace(/<option[^>]*>[^<]*<\/option>/g,m=>{let x=state.animals.find(z=>m.includes('value="'+E(z.id)+'"'));return x?m.replace(/>[^<]*<\/option>/,'>'+E(x.name+(x.tag?' · '+x.tag:''))+'</option>'):m});html+=field(['date','Record date','रिकॉर्ड की तारीख','date',true],a.date||day())}html+=fields.map(f=>field(f,a[f[0]]??(f[0]==='status'?'Unknown':f[0]==='sex'?'Unknown':''))).join('')+'</div><div class="actions"><button class="primary" type="submit">'+T('Save record','सहेजें')+'</button>'+btn(T('Cancel','रद्द करें'),'close')+'</div></form>';let d=$('#modal');d.innerHTML=html;if(!d.open)d.showModal();$('#entry').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));for(let k in data)data[k]=String(data[k]).trim();if(isAnimal&&!data.name||!isAnimal&&fields.some(f=>f[4]&&!data[f[0]])){notify(T('Complete required fields.','ज़रूरी जानकारी भरें।'));return}if(isAnimal&&data.tag&&state.animals.some(x=>x.id!==id&&String(x.tag).toLowerCase()===data.tag.toLowerCase())){notify(T('This tag already exists.','यह टैग पहले से है।'));return}if(!isAnimal&&data.due&&data.due<data.date){notify(T('Next date cannot be before record date.','अगली तारीख रिकॉर्ड से पहले नहीं हो सकती।'));return}if(type==='production'&&['milk','weight','eggs'].every(k=>data[k]==='')){notify(T('Enter milk, weight or eggs.','दूध, वजन या अंडे दर्ज करें।'));return}let item={...data,id:old?.id||uid(),...(isAnimal?{}:{type})},list=isAnimal?'animals':'records',next={...state,[list]:old?state[list].map(x=>x.id===old.id?item:x):[...state[list],item]};if(commit(next)){d.close();notify(T('Saved successfully','सफलतापूर्वक सहेजा गया'));if(isAnimal)go('profile',item.id);else render()}}}
function settings(){return title('Settings & backup','सेटिंग और बैकअप',T('Your records stay in this browser.','रिकॉर्ड इसी ब्राउज़र में रहते हैं।'))+'<div class="card stack"><h2>'+T('Data management','डेटा प्रबंधन')+'</h2><p>'+T('Export a backup regularly. No cloud sync or account authentication is included. Backups contain personal data; keep them private.','नियमित बैकअप लें। क्लाउड सिंक या लॉगिन नहीं है। बैकअप निजी रखें।')+'</p>'+btn(T('Download JSON backup','JSON बैकअप डाउनलोड'),'export','primary')+btn(T('Export animal list CSV','पशु सूची CSV'),'csv')+btn(T('Load sample animals','नमूना पशु जोड़ें'),'demo')+'<p class="fine">'+T('Sample data is fictional. This tool records information; it does not diagnose diseases or prescribe treatment. Contact a veterinarian for clinical decisions.','नमूने काल्पनिक हैं। यह ऐप रिकॉर्ड रखता है, निदान या उपचार नहीं बताता। पशु चिकित्सक से संपर्क करें।')+'</p></div>'}
function render(){document.documentElement.lang=state.hi?'hi':'en';$('#language').textContent=T('हिन्दी','English');$('#nav').innerHTML=[['home','⌂','Home','होम'],['animals','🐾','Animals','पशु'],['records','▤','Records','रिकॉर्ड'],['reports','▥','Reports','रिपोर्ट'],['settings','⚙','Settings','सेटिंग']].map(([p,i,en,hi])=>'<button data-action="go:'+p+'" class="'+((page===p||p==='animals'&&page==='profile')?'active':'')+'"><span>'+i+'</span>'+T(en,hi)+'</button>').join('');let content=page==='home'?home():page==='animals'?animalList():page==='profile'?profile():page==='reports'?title('Farm reports','फार्म रिपोर्ट',T('Charts update from your saved records.','चार्ट आपके रिकॉर्ड से बनते हैं।'))+'<div class="section">'+reportCards()+'</div>':page==='records'?title('All records','सभी रिकॉर्ड',T('Health, vaccines, breeding, feed and more.','स्वास्थ्य, टीके, प्रजनन और चारा।'))+'<div class="grid section">'+Object.entries(types).map(([k,v])=>btn(v[2]+' '+T(v[0],v[1]),'record:'+k)).join('')+'</div><div class="card section">'+(state.records.length?state.records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(recordRow).join(''):empty(T('No records yet.','अभी कोई रिकॉर्ड नहीं।')))+'</div>':settings();$('#main').innerHTML=(!storageOK?'<p class="alert">'+T('Browser storage could not be read.','ब्राउज़र डेटा पढ़ा नहीं जा सका।')+'</p>':'')+content;if(page==='animals'){results();$('#search').oninput=e=>{query=e.target.value;results()};$('#filter').onchange=e=>{filter=e.target.value;results()}}}
function download(name,data,mime){let url=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function demo(){if(state.animals.length){notify(T('Sample data is only available for an empty register.','नमूने केवल खाली रजिस्टर में जोड़ सकते हैं।'));return}let a=[{id:uid(),name:'Gauri',species:'Cow',breed:'Gir',tag:'DEMO-01',sex:'Female',status:'Healthy',weight:'350',owner:'Demo farmer',village:'Sample village'},{id:uid(),name:'Kali',species:'Buffalo',breed:'Murrah',tag:'DEMO-02',sex:'Female',status:'Healthy',weight:'480'},{id:uid(),name:'Chutki',species:'Goat',breed:'Sirohi',tag:'DEMO-03',sex:'Female',status:'Recovering',weight:'28'}];let r=[{id:uid(),animal:a[0].id,type:'production',date:day(),milk:'8',notes:'Fictional sample'},{id:uid(),animal:a[0].id,type:'vaccine',date:day(),title:'Example recorded dose',notes:'Demo only, not a schedule'},{id:uid(),animal:a[2].id,type:'health',date:day(),title:'Example checkup',notes:'Demo only'}];if(commit({...state,animals:a,records:r})){go('home');notify(T('Sample data added','नमूना डेटा जोड़ा गया'))}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let [act,id]=b.dataset.action.split(':');switch(act){case'go':go(id);break;case'profile':go('profile',id);break;case'add':formOpen('animal');break;case'edit':formOpen('animal',id);break;case'record':formOpen(id);break;case'editRecord':{let r=state.records.find(x=>x.id===id);if(r)formOpen(r.type,id);break}case'close':$('#modal').close();break;case'delete':if(confirm(T('Delete this animal and all its records?','इस पशु और सभी रिकॉर्ड को हटाएं?'))&&commit({...state,animals:state.animals.filter(a=>a.id!==id),records:state.records.filter(r=>r.animal!==id)}))go('animals');break;case'deleteRecord':if(confirm(T('Delete this record?','रिकॉर्ड हटाएं?'))&&commit({...state,records:state.records.filter(r=>r.id!==id)}))render();break;case'export':download('pashusetu-'+day()+'.json',JSON.stringify(state,null,2),'application/json');break;case'csv':{let cols=animalFields.map(f=>f[0]),esc=x=>'"'+String(x??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';download('animals.csv','\uFEFF'+[cols.join(','),...state.animals.map(a=>cols.map(k=>esc(a[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8');break}case'demo':demo();break}});
$('#language').onclick=()=>{if(commit({...state,hi:!state.hi}))render()};render();
